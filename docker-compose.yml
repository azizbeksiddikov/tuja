# Local development database only. Credentials here are dev-only defaults, not secrets.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: bank
      POSTGRES_DB: bank
    ports:
      - "127.0.0.1:4221:5432"
    volumes:
      - bank_dev_pg:/var/lib/postgresql/data
volumes:
  bank_dev_pg:
